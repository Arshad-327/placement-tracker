<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Placement Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A38;
    --ink-soft:#4B5A6B;
    --paper:#F6F3EC;
    --paper-raised:#FFFFFF;
    --line:#DED8C8;
    --amber:#C98A3B;
    --amber-dark:#A96F27;
    --accepted:#4F7C5D;
    --accepted-bg:#E7EFE6;
    --declined:#B5533D;
    --declined-bg:#F5E7E2;
    --pending:#A98F5C;
    --pending-bg:#F1EBDB;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  h1,h2,h3{
    font-family:'Source Serif 4', serif;
    margin:0;
    color:var(--ink);
  }
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:28px 24px 80px;
  }
  header.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
    padding-bottom:18px;
    border-bottom:2px solid var(--ink);
    margin-bottom:22px;
  }
  header.top h1{
    font-size:30px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  header.top p{
    margin:4px 0 0;
    color:var(--ink-soft);
    font-size:14px;
  }
  .stats-strip{
    display:flex;
    gap:26px;
  }
  .stat{
    text-align:right;
  }
  .stat .n{
    font-family:'Source Serif 4', serif;
    font-size:26px;
    font-weight:600;
    display:block;
    line-height:1;
  }
  .stat .l{
    font-size:11.5px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  .stat.accepted .n{color:var(--accepted);}
  .stat.pending .n{color:var(--pending);}
  .stat.declined .n{color:var(--declined);}

  .layout{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:36px;
    align-items:start;
  }
  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
  }

  section.panel{
    background:var(--paper-raised);
    border:1px solid var(--line);
    padding:20px;
  }
  section.panel + section.panel{margin-top:24px;}

  .side h2{
    font-size:17px;
    margin-bottom:4px;
  }
  .side .hint{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }

  #companyList{
    max-height:420px;
    overflow-y:auto;
    padding-right:4px;
  }
  .company-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid var(--line);
  }
  .company-row:last-child{border-bottom:none;}
  .company-row .name{
    font-weight:600;
    font-size:14px;
  }
  .company-row .meta{
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .company-row .del{
    background:none;
    border:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:13px;
    padding:2px 6px;
  }
  .company-row .del:hover{color:var(--declined);}

  .add-company-form{
    display:flex;
    gap:6px;
    margin-top:12px;
  }
  .add-company-form input{
    flex:1;
    min-width:0;
  }

  input, select{
    font-family:inherit;
    font-size:13.5px;
    padding:8px 10px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
  }
  input:focus, select:focus{
    outline:none;
    border-color:var(--amber);
  }

  button.primary{
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:9px 16px;
    cursor:pointer;
  }
  button.primary:hover{background:var(--amber-dark);}

  .main h2{
    font-size:19px;
    margin-bottom:14px;
  }

  .add-contact-form{
    display:grid;
    grid-template-columns:1.3fr 1.1fr 0.9fr 0.9fr auto;
    gap:8px;
    margin-bottom:22px;
  }
  @media (max-width:700px){
    .add-contact-form{grid-template-columns:1fr 1fr;}
  }

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .filters{
    display:flex;
    gap:6px;
  }
  .filters button{
    font-family:inherit;
    font-size:12.5px;
    background:none;
    border:1px solid var(--line);
    padding:6px 12px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .filters button.active{
    border-color:var(--ink);
    color:var(--ink);
    font-weight:600;
  }
  .search{
    width:220px;
  }

  .table-scroll{
    max-height:520px;
    overflow-y:auto;
    border-bottom:1px solid var(--line);
  }
  table{
    width:100%;
    border-collapse:collapse;
  }
  thead th{
    position:sticky;
    top:0;
    background:var(--paper-raised);
    text-align:left;
    font-size:11.5px;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    font-weight:600;
    padding:8px 6px;
    border-bottom:2px solid var(--ink);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  thead th:hover{color:var(--ink);}
  tbody tr{
    border-bottom:1px solid var(--line);
  }
  tbody tr:hover{background:#FBF9F4;}
  tbody td{
    padding:10px 6px;
    font-size:13.5px;
    vertical-align:middle;
  }
  td.company{
    font-weight:600;
  }
  td.source{
    color:var(--ink-soft);
    font-size:12.5px;
  }
  select.status-select{
    font-size:12px;
    font-weight:600;
    padding:4px 8px;
    border:none;
    cursor:pointer;
  }
  select.status-select.yes{background:var(--accepted-bg); color:var(--accepted);}
  select.status-select.no{background:var(--declined-bg); color:var(--declined);}
  select.status-select.pending{background:var(--pending-bg); color:var(--pending);}

  .row-del{
    background:none;
    border:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:14px;
  }
  .row-del:hover{color:var(--declined);}

  .empty{
    padding:30px 6px;
    color:var(--ink-soft);
    font-size:13.5px;
    font-style:italic;
  }

  .snum{
    color:var(--ink-soft);
    font-size:12px;
    width:28px;
  }

  .loading-note{
    padding:40px;
    text-align:center;
    color:var(--ink-soft);
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Placement Tracker</h1>
      <p>Target companies &amp; alumni outreach log</p>
    </div>
    <div class="stats-strip" id="statsStrip"></div>
  </header>

  <div class="layout" id="app">
    <div class="loading-note">Loading your data…</div>

</div>

const SEED_COMPANIES = [];
const seenCo = new Set();
[...new Set(SEED_CONTACTS.map(c=>c.company)), ...EXTRA_TARGET_COMPANIES].forEach((name)=>{
  const key = name.toLowerCase();
  if(!seenCo.has(key)){
    seenCo.add(key);
    SEED_COMPANIES.push({id: uid('c'), name, notes:''});
  }
});

let data = { contacts: [], companies: [] };
let filterStatus = 'All';
let searchTerm = '';
let sortKey = 'company';
let sortDir = 1;

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      data = JSON.parse(res.value);
    } else {
      data = { contacts: SEED_CONTACTS, companies: SEED_COMPANIES };
      await persist();
    }
  }catch(e){
    data = { contacts: SEED_CONTACTS, companies: SEED_COMPANIES };
    await persist();
  }
  render();
}

async function persist(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(data), false);
  }catch(e){
    console.error('Could not save', e);
  }
}

function uid(prefix){
  return prefix + '-' + Date.now() + '-' + Math.floor(Math.random()*10000);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function render(){
  const app = document.getElementById('app');

  const total = data.contacts.length;
  const yes = data.contacts.filter(c=>c.status==='Yes').length;
  const no = data.contacts.filter(c=>c.status==='No').length;
  const pending = data.contacts.filter(c=>c.status==='Pending').length;

  document.getElementById('statsStrip').innerHTML = `
    <div class="stat"><span class="n">${total}</span><span class="l">Contacted</span></div>
    <div class="stat accepted"><span class="n">${yes}</span><span class="l">Accepted</span></div>
    <div class="stat pending"><span class="n">${pending}</span><span class="l">Pending</span></div>
    <div class="stat declined"><span class="n">${no}</span><span class="l">Declined</span></div>
  `;

  const companyAccCount = {};
  data.contacts.forEach(c=>{
    if(!companyAccCount[c.company]) companyAccCount[c.company] = {yes:0,total:0};
    companyAccCount[c.company].total++;
    if(c.status==='Yes') companyAccCount[c.company].yes++;
  });

  const companiesHtml = data.companies.length ? data.companies.map(co=>{
    const stat = companyAccCount[co.name];
    const metaText = stat ? `${stat.yes}/${stat.total} accepted` : 'no contacts yet';
    return `
      <div class="company-row">
        <div>
          <div class="name">${escapeHtml(co.name)}</div>
          <div class="meta">${metaText}</div>
        </div>
        <button class="del" data-del-company="${co.id}" title="Remove company">✕</button>
      </div>
    `;
  }).join('') : `<div class="empty">No target companies yet — add one below.</div>`;

  let contacts = [...data.contacts];
  if(filterStatus !== 'All'){
    contacts = contacts.filter(c => c.status === filterStatus);
  }
  if(searchTerm.trim()){
    const t = searchTerm.trim().toLowerCase();
    contacts = contacts.filter(c =>
      c.name.toLowerCase().includes(t) || c.company.toLowerCase().includes(t)
    );
  }
  contacts.sort((a,b)=>{
    const av = (a[sortKey]||'').toLowerCase();
    const bv = (b[sortKey]||'').toLowerCase();
    if(av < bv) return -1*sortDir;
    if(av > bv) return 1*sortDir;
    return 0;
  });

  const rowsHtml = contacts.length ? contacts.map((c,i)=>`
    <tr data-id="${c.id}">
      <td class="snum">${i+1}</td>
      <td>${escapeHtml(c.name)}</td>
      <td class="company">${escapeHtml(c.company)}</td>
      <td class="source">${escapeHtml(c.source)}</td>
      <td>
        <select class="status-select ${c.status.toLowerCase()}" data-status-id="${c.id}">
          <option value="Yes" ${c.status==='Yes'?'selected':''}>Yes</option>
          <option value="No" ${c.status==='No'?'selected':''}>No</option>
          <option value="Pending" ${c.status==='Pending'?'selected':''}>Pending</option>
        </select>
      </td>
      <td><button class="row-del" data-del-contact="${c.id}" title="Remove">✕</button></td>
    </tr>
  `).join('') : `<tr><td colspan="6" class="empty">No contacts match this view.</td></tr>`;

  app.innerHTML = `
    <div class="side">
      <section class="panel">
        <h2>Target companies</h2>
        <p class="hint">Companies you're planning to apply to</p>
        <div id="companyList">${companiesHtml}</div>
        <form class="add-company-form" id="addCompanyForm">
          <input type="text" id="newCompanyName" placeholder="Company name" required>
          <button class="primary" type="submit">Add</button>
        </form>
      </section>
    </div>

    <div class="main">
      <section class="panel">
        <h2>Log a contact</h2>
        <form class="add-contact-form" id="addContactForm">
          <input type="text" id="fName" placeholder="Alumni name" required>
          <input type="text" id="fCompany" placeholder="Company" required list="companyDatalist">
          <select id="fSource">
            <option>LinkedIn</option>
            <option>WhatsApp</option>
            <option>Email</option>
            <option>Other</option>
          </select>
          <select id="fStatus">
            <option value="Pending">Pending</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
          <button class="primary" type="submit">Add</button>
        </form>
        <datalist id="companyDatalist">
          ${[...new Set(data.contacts.map(c=>c.company).concat(data.companies.map(c=>c.name)))]
            .map(n=>`<option value="${escapeHtml(n)}">`).join('')}
        </datalist>
      </section>

      <section class="panel" style="margin-top:20px;">
        <div class="toolbar">
          <div class="filters">
            ${['All','Yes','No','Pending'].map(s=>`
              <button class="${filterStatus===s?'active':''}" data-filter="${s}">${s}</button>
            `).join('')}
          </div>
          <input type="text" class="search" id="searchInput" placeholder="Search name or company…" value="${escapeHtml(searchTerm)}">
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th class="snum">#</th>
                <th data-sort="name">Name</th>
                <th data-sort="company">Company</th>
                <th data-sort="source">Source</th>
                <th data-sort="status">Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      </section>
    </div>
  `;

  attachHandlers();
}

function attachHandlers(){
  document.getElementById('addCompanyForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const input = document.getElementById('newCompanyName');
    const name = input.value.trim();
    if(!name) return;
    data.companies.push({id: uid('c'), name, notes:''});
    await persist();
    render();
  });

  document.querySelectorAll('[data-del-company]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-del-company');
      data.companies = data.companies.filter(c=>c.id!==id);
      await persist();
      render();
    });
  });

  document.getElementById('addContactForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const name = document.getElementById('fName').value.trim();
    const company = document.getElementById('fCompany').value.trim();
    const source = document.getElementById('fSource').value;
    const status = document.getElementById('fStatus').value;
    if(!name || !company) return;
    data.contacts.push({id: uid('p'), name, company, source, status, notes:''});
    await persist();
    render();
  });

  document.querySelectorAll('[data-status-id]').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const id = sel.getAttribute('data-status-id');
      const c = data.contacts.find(c=>c.id===id);
      if(c){ c.status = sel.value; }
      await persist();
      render();
    });
  });

  document.querySelectorAll('[data-del-contact]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-del-contact');
      data.contacts = data.contacts.filter(c=>c.id!==id);
      await persist();
      render();
    });
  });

  document.querySelectorAll('[data-filter]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      filterStatus = btn.getAttribute('data-filter');
      render();
    });
  });

  document.getElementById('searchInput').addEventListener('input', (e)=>{
    searchTerm = e.target.value;
    render();
    const inp = document.getElementById('searchInput');
    if(inp){
      inp.focus();
      const pos = inp.value.length;
      inp.setSelectionRange(pos, pos);
    }
  });

  document.querySelectorAll('[data-sort]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.getAttribute('data-sort');
      if(sortKey === key){ sortDir *= -1; } else { sortKey = key; sortDir = 1; }
      render();
    });
  });
}

loadData();
</script>
